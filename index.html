<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clasificador de Billetes - ML5.js</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        text-align: center;
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      #status {
        margin: 10px 0;
        padding: 10px;
        background-color: #fff;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      #canvas-container {
        margin: 20px 0;
        padding: 10px;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      .drop-zone {
        border: 2px dashed #ccc;
        border-radius: 10px;
        padding: 20px;
        margin: 20px 0;
        background-color: #fafafa;
        cursor: pointer;
      }
      .drop-zone:hover {
        border-color: #666;
        background-color: #f5f5f5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Clasificador de Billetes con ML5.js</h1>
      <div id="status">Estado: Cargando imágenes...</div>
      <div id="canvas-container"></div>
      <div class="drop-zone" id="dropZone">
        Arrastra una imagen aquí o haz clic para seleccionar
        <input type="file" id="fileInput" accept="image/*" style="display: none">
      </div>
    </div>
    <script src="sketch.js"></script>
    <script>
      // Configurar la zona de arrastre
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');

      // Manejar clic en la zona de arrastre
      dropZone.addEventListener('click', () => {
        fileInput.click();
      });

      // Manejar selección de archivo
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          handleFile(file);
        }
      });

      // Prevenir comportamiento por defecto del navegador
      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#666';
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.style.borderColor = '#ccc';
      });

      // Manejar soltar archivo
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = '#ccc';
        const file = e.dataTransfer.files[0];
        if (file) {
          handleFile(file);
        }
      });

      // Función para procesar el archivo
      function handleFile(file) {
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              if (typeof dropHandler === 'function') {
                dropHandler({
                  type: 'image',
                  data: e.target.result
                });
              }
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
      }

      // Función para actualizar el estado
      function updateStatus(message) {
        document.getElementById('status').textContent = 'Estado: ' + message;
      }
    </script>
  </body>
</html>
